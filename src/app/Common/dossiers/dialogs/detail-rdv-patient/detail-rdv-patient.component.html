<div class="modal">
  <div *nzModalTitle class="make-spaceBetween">
    <p>{{titleForm}}</p>
    <img src="assets/from_figma/close_modal.svg" alt="Fermer le form" (click)="handleCancel()">
  </div>

  <div>
    <form nz-form [formGroup]="RvForm" class="login-form" >
      <p class="connect-phrase">{{formDesc}}</p>

      <div class="make-spaceBetween">
        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez renseigner votre identifiant!">
            <p class="input-label">Prenom</p>
            <input nz-input placeholder="Prenom" type="text" formControlName="prenom" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez renseigner votre identifiant!">
            <p class="input-label">Nom</p>
            <input nz-input placeholder="Nom" type="text" formControlName="nom" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="make-spaceBetween">
        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez renseigner votre identifiant!">
            <p class="input-label">Telephone</p>
            <input nz-input placeholder="telephone" type="text" formControlName="telephone" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control>
            <p class="input-label">Date naissance</p>
            <nz-date-picker nzPlaceHolder="Choissez la date" nzFormat="dd-MM-YYYY" formControlName="date"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="make-spaceBetween">
        <nz-form-item>
          <nz-form-control nzErrorTip="Veuillez renseigner votre identifiant!">
            <p class="input-label">Genre</p>
            <nz-select nzShowSearch nzPlaceHolder="Choissez le genre" formControlName="genre">
              <nz-option nzLabel="----"></nz-option>
              <nz-option nzLabel="Masculin" nzValue="Masculin"></nz-option>
              <nz-option nzLabel="Feminin" nzValue="Feminin"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

    </form>
  </div>

  <div *nzModalFooter class="footer-btn">
    <button nz-button nzType="default" (click)="handleCancel()">Annuler</button>
    <button nz-button nzType="primary" (click)="handleOk()" [nzLoading]="isConfirmLoading">{{btnText}}</button>
  </div>
</div>


<ng-template #addSuffixUserIcon>
  <div class="mySuffixTemp">
    <img src="assets/from_figma/import_logo.svg" alt="Importer" class="svg-icon">
    <span>Importer</span>
  </div>

</ng-template>
