<div *nzModalTitle class="make-spaceBetween">
  <p>{{titleForm}}</p>
  <img src="assets/from_figma/close_modal.svg" alt="Fermer le form" (click)="handleCancel()">
</div>

<div>
  <form nz-form [formGroup]="prestationForm" class="login-form" >
    <input (change)="getEvent($event)"
           accept=".pdf, image/*, .doc, .docx, .xls, .xlsx"
           hidden
           id='file_uploader'
           type='file'/>
    <p class="connect-phrase">{{formDesc}}</p>
    <div class="make-spaceBetween">
      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez choisir un service!">
          <p class="input-label">Service</p>
          <nz-select nzAllowClear nzShowSearch nzPlaceHolder="Choissez un service" formControlName="service">
            <nz-option nzLabel="----"></nz-option>
            <nz-option-group *ngFor="let pole of listOfPole" [nzLabel]="pole.nom">
              <nz-option
                *ngFor="let service of getAllServicesByPole(pole)"
                [nzLabel]="service.nom!+' - ' + service.cout" [nzValue]="service.id"></nz-option>
            </nz-option-group>

          </nz-select>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez Choisir un patient">
          <p class="input-label">Patient</p>
          <nz-select nzAllowClear nzShowSearch [nzDropdownRender]="addNewPatientTemplate" nzPlaceHolder="Choissez un patient"
                     formControlName="dossier">
            <nz-option nzLabel="----"></nz-option>
            <nz-option
              *ngFor="let dossier of listOfDossierMedical"
              [nzLabel]="getPatientFullName(dossier)+ ' - '+ dossier.patient?.personne!.telephone"
              [nzValue]="dossier.id"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="make-spaceBetween">
      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez choisir une prescription!">
          <p class="input-label">Prérequis</p>
          <nz-input-group >
            <input type="text" nz-input formControlName="prerequis" placeholder="Renseignez les conditions à respecter " />
          </nz-input-group>
          <!--
                    <nz-select nzShowSearch nzPlaceHolder="Choissez les prescriptions"
                               formControlName="prescription" (selectionchange)="displayEvent($event)">
                      <nz-option nzLabel="&#45;&#45;&#45;&#45;"></nz-option>
                      <nz-option
                        *ngFor="let medicament of listPrescription"
                        [nzLabel]="medicament.libelle" [nzValue]="medicament"></nz-option>
                    </nz-select>
          -->
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez renseigner le diagnostic!">
          <p class="input-label">Diagnostic</p>
          <nz-input-group >
            <input type="text" nz-input formControlName="diagnostic" placeholder="Renseignez le diagnostique" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div class="make-spaceBetween">
      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez renseigner votre mot de passe!">
          <p class="input-label">Résultat</p>
          <nz-input-group [nzAddOnAfter]="addSuffixUserIcon" (click)="triggerFileUpload()">
            <input type="text" nz-input formControlName="resultat" placeholder="Renseignez le résultat" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control nzErrorTip="Veuillez renseigner la conclusion!">
          <p class="input-label">Conclusion</p>
          <nz-input-group >
            <input type="text" nz-input formControlName="conclusion" placeholder="Renseignez la conclusion" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
    </div>

  </form>
</div>

<div *nzModalFooter>
  <button nz-button class="my-default-button basic-button" (click)="handleCancel()">Annuler</button>
  <button (click)="addPrestation()"
          [disabled]="prestationForm.invalid"
          [ngClass]="{'buttonIsDisabled': prestationForm.invalid, 'basic-button' : true, 'my-primary-button': prestationForm.valid}" [nzLoading]="isConfirmLoading"
          [nzTooltipTitle]="prestationForm.invalid ? 'Veuillez bien remplir le formulaire': 'Enregistrer'" nz-button nz-tooltip>
    {{ btnText }}
  </button>
</div>

<ng-template #addSuffixUserIcon>
  <div class="mySuffixTemp">
    <img src="assets/from_figma/import_logo.svg" alt="Importer" class="svg-icon">
    <span>Importer</span>
  </div>

</ng-template>

<ng-template #addNewPatientTemplate>
  <nz-divider></nz-divider>
  <div class="container">
    <a class="add-item" (click)="addNewPatient()">
      <i nz-icon nzType="plus"></i>
      Ajouter nouveau patient
    </a>
  </div>
</ng-template>
