<div class="mainbody">
  <div class="patient-form">
    <form [formGroup]="patientForm" (submit)="updatePatient()">
      <div class="button">
        <button class="btn" type="submit">Enregistrer</button>
      </div>

      <div class="card-information">
        <div class="formheader">
          <h3 class="title">Informations sur le patient</h3>
        </div>
        <div class="form">
          <div class="gender">
            <!-- Gender Input -->
            <label class="label">Genre</label>
            <!-- ... (Other gender code) -->
          </div>

          <div class="name">
            <!-- Name Inputs -->
            <div class="prenom">
              <label class="label" for="prenom">Prénom</label>
              <input class="input" type="text" id="prenom" name="prenom" formControlName="prenom" required>
            </div>
            <div class="nom">
              <label class="label" for="nom">Nom</label>
              <input class="input" type="text" id="nom" name="nom" formControlName="nom" required>
            </div>
          </div>

          <div class="phone-date">
            <!-- Phone and Date Inputs -->
            <!-- ... (Other phone-date code) -->
          </div>

          <div class="blood-address">
            <!-- Blood and Address Inputs -->
            <!-- ... (Other blood-address code) -->
          </div>
        </div>
      </div>

      <div class="allergies-card">
        <div class="headerForm">
          <h3 class="title">
            Antecedants medicaux et patologies
          </h3>
        </div>
        <div class="form">
          <div class="medecin">
            <!-- Antecedant_patologie Textarea -->
            <label class="label" for="antecedant_patologie">Antecedants medicaux et patologies</label>
            <textarea class="input" id="antecedant_patologie" name="antecedant_patologie" formControlName="antecedant_patologie" required placeholder="Enumerer les Antecedants medicaux et les patologies s'il y'en a"></textarea>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Display Patient Information -->
  <div *ngIf="patient" class="patient-info">
    <h3 class="title">Informations du patient</h3>
    <div>
      <strong>Genre:</strong> {{ patientForm.get('genre')?.value }}
    </div>
    <div>
      <strong>Prénom:</strong> {{ patientForm.get('prenom')?.value }}
    </div>
    <div>
      <strong>Nom:</strong> {{ patientForm.get('nom')?.value }}
    </div>
    <!-- Add more fields as needed -->
  </div>
</div>
